name: cycla
description: "Cycla - Fatura ve Abonelik Takipçisi. Hukuki yönergelere uygun, çevrimdışı öncelikli Flutter finans uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Yerel Veri Saklama (Offline-First, sıfır kod üretimi gereksinimi)
  shared_preferences: ^2.3.2

  # Yerel Zamanlanmış Bildirimler
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Tarih ve Para Birimi Formatlama
  intl: ^0.19.0

  # Grafikler ve Takvim Görünümü
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2

  # Yardımcı Paketler
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

